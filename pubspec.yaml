name: gecko
description: Pay with G1.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.1.4+66

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  bubble: ^1.2.1
  carousel_slider: ^4.2.1
  graphql_flutter: ^5.1.2
  hive_flutter: ^1.1.0
  image_picker: ^1.0.5
  jdenticon_dart: ^2.0.0
  logger: ^2.0.2+1
  path_provider: ^2.1.1
  pdf: ^3.10.7
  permission_handler: ^11.1.0
  pin_code_fields: ^8.0.1
  printing: ^5.11.1
  provider: ^6.1.1
  barcode_scan2: ^4.3.0
  qr_flutter: ^4.1.0
  responsive_framework: ^1.1.1
  sentry_flutter: ^7.14.0
  truncate: ^3.0.1
  unorm_dart: ^0.3.0
  dio: ^5.4.0
  durt: ^0.1.7
  package_info_plus: ^5.0.1
  polkawallet_sdk: #^0.5.2
    git:
      # url: https://github.com/polkawallet-io/sdk.git
      # ref: develop
      url: https://github.com/poka-IT/sdk.git
      # ref: gecko-fixes-3
      ref: 8b254d9e98cb367b4a57d67f8c6f5bbe89a52552
  dots_indicator: ^3.0.0
  connectivity_plus: ^3.0.6
  image_cropper: ^4.0.1
  easy_localization: ^3.0.3
  flutter_markdown: ^0.6.18+2
  pointycastle: ^3.7.3
  hex: ^0.2.0
  accordion: ^2.6.0
  flutter_svg: ^2.0.9
  pinenacl: ^0.3.4
  fast_base58: ^0.2.1
  tutorial_coach_mark: ^1.2.11
  confetti: ^0.7.0
  url_launcher: ^6.2.2
  crypto: ^3.0.3
  screen_brightness: ^0.2.2+1
  uuid: ^3.0.7
  fade_and_translate: ^0.1.3

dev_dependencies:
  # flutter_launcher_icons: ^0.9.2
  # flutter_launcher_icons_maker: ^^0.10.2
  icons_launcher: ^2.1.6
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  dart_code_metrics: ^5.7.6

icons_launcher:
  image_path: "assets/icon/gecko_flat.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

# flutter_icons:
#   android: "launcher_icon"
#   ios: true
#   image_path: "assets/icon/gecko_flat.png"
#   min_sdk_android: 21
#   remove_alpha_ios: true

uses-material-design: true

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - config/
    - assets/
    - assets/translations/
    - assets/home/
    - assets/avatars/
    - assets/chests/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - sounds/
