name: gecko
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+10

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dubp:
    path: packages/dubp_rs
  flutter_launcher_icons: "^0.8.0"
  qrscan: ^0.2.21
  permission_handler:
  image_gallery_saver:
  image_picker:
  graphql_flutter: ^4.0.0 #^3.1.0
  provider: ^4.3.2+3
  truncate: ^2.1.2
  path_provider: ^1.6.24
  pin_code_fields: ^6.0.2
  http: ^0.12.2
  super_tooltip: ^0.9.6
  package_info: ^0.4.3+2
  printing: ^4.0.0
  shared_preferences: ^0.5.12+4
  sync_http: ^0.2.0
  crypto: ^2.1.5
  fast_base58:
  logger: ^0.9.4
  flutter_logs: ^2.1.3
  sentry: ^4.0.4
  sentry_flutter: ^4.0.4
  catcher: ^0.4.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/gecko_final.png"
  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - images/
    - config/gva_endpoints.json
    - assets/icon/gecko_final.png
    - assets/
    - assets/OpenSans-Regular.ttf
    - assets/icon_user.png
    - assets/qrcode-scan.png
    - assets/blockchain.png
