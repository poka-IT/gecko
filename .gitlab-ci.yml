# Gecko CI/CD Pipeline
# Build and release for Android, iOS, and Linux Desktop
#
# OPTIMIZED VERSION: Uses custom Docker image from Docker Hub with pre-installed dependencies
# To build and push: ./scripts/build-and-push-ci-image.sh <version>
# Docker Hub: https://hub.docker.com/r/poka/gecko-ci

stages:
  - format
  - build
  - publish
  - deploy
  - release

variables:
  FLUTTER_VERSION: "3.35.2"

# Base job for Flutter environment (optimized with pre-installed dependencies)
.flutter_env:
  image: poka/gecko-ci:latest  # Custom image with all dependencies pre-installed
  before_script:
    - echo "Using optimized Flutter environment..."
    - flutter --version
    - ./scripts/setup-ci-dependencies.sh
  tags:
    - docker

# Android-specific environment (optimized with pre-installed Java 17)
.android_env:
  image: poka/gecko-ci:latest  # Custom image with Java 17 and Android tools pre-installed
  variables:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  before_script:
    - echo "Using optimized Android build environment..."
    - export PATH=$JAVA_HOME/bin:$PATH
    - java -version
    - flutter --version
    - ./scripts/setup-ci-dependencies.sh
    - ./scripts/setup-android-signing.sh
  tags:
    - docker

# Format check job
format:
  extends: .flutter_env
  stage: format
  rules:
    - when: always
  script:
    - dart format --set-exit-if-changed lib

# Build Android APKs (split by architecture) - Direct downloads
build:android:apk:
  extends: .android_env
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    # Extract version from pubspec.yaml
    - export VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')
    - export BUILD=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $2}')
    - echo "Building Gecko Android APKs v${VERSION}+${BUILD}"
    
    # Clean and build
    - flutter build apk --release --split-per-abi --build-name $VERSION --build-number $BUILD
    
    # Rename APKs with version
    - mkdir -p artifacts/android
    - mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/android/gecko-${VERSION}+${BUILD}-v7a.apk
    - mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/android/gecko-${VERSION}+${BUILD}-v8a.apk
    - mv build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/android/gecko-${VERSION}+${BUILD}-x86_64.apk
    
    # Store version info and job ID for later jobs
    - echo "${VERSION}+${BUILD}" > artifacts/version.txt
    - echo "$CI_JOB_ID" > artifacts/apk_job_id.txt
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

publish:forum:apk:
  image: poka/gecko-ci:latest
  stage: publish
  dependencies:
    - build:android:apk
  needs:
    - job: build:android:apk
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - when: manual
  script:
    - export VERSION=$(cat artifacts/version.txt)
    - export APK_JOB_ID=$(cat artifacts/apk_job_id.txt)
    - export FORUM_MODE="apk_only"
    - echo "New version ${VERSION} of Gecko mobile" > /tmp/message.txt
    - python3 scripts/publish-forum.py

publish:forum:complete:
  image: poka/gecko-ci:latest
  stage: release
  dependencies:
    - build:android:apk
    - build:android:bundle
    - build:ios
    - build:linux
  needs:
    - job: build:android:apk
    - job: build:android:bundle
    - job: build:ios
    - job: build:linux
    - job: deploy:android:playstore
    - job: deploy:ios:appstore
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - export VERSION=$(cat artifacts/version.txt)
    - export APK_JOB_ID=$(cat artifacts/apk_job_id.txt)
    - echo "New version ${VERSION} of Gecko mobile" > /tmp/message.txt
    - python3 scripts/publish-forum.py

# Build Android App Bundle (AAB) - Google Play Store
build:android:bundle:
  extends: .android_env
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - export VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')
    - export BUILD=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $2}')
    - echo "Building Gecko Android Bundle v${VERSION}+${BUILD}"
    
    - flutter build appbundle --release --build-name $VERSION --build-number $BUILD
    
    - mkdir -p artifacts/android
    - mv build/app/outputs/bundle/release/app-release.aab artifacts/android/gecko-${VERSION}+${BUILD}.aab
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

# Build iOS IPA - App Store
build:ios:
  stage: build
  tags:
    - macos
    - shared
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  before_script:
    # Install Flutter on macOS
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Installing Flutter..."
        git clone https://github.com/flutter/flutter.git -b stable ~/flutter
        export PATH="$PATH:~/flutter/bin"
      fi
    - flutter --version
    - ./scripts/setup-ci-dependencies.sh
  script:
    - export VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')
    - export BUILD=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $2}')
    - echo "Building Gecko iOS IPA v${VERSION}+${BUILD}"
    
    # Update Info.plist temporarily
    - sed -i '' "s|\$(FLUTTER_BUILD_NAME)|${VERSION}|g" ios/Runner/Info.plist
    - sed -i '' "s|\$(fFLUTTER_BUILD_NUMBER)|${BUILD}|g" ios/Runner/Info.plist
    
    - flutter build ipa --release --build-name=$VERSION --build-number=$BUILD --export-options-plist=ios/ExportOptions.plist
    
    # Restore Info.plist
    - git checkout ios/Runner/Info.plist
    
    - mkdir -p artifacts/ios
    - mv build/ios/ipa/gecko.ipa artifacts/ios/gecko-${VERSION}+${BUILD}.ipa
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

# Build Linux Desktop - Direct download
build:linux:
  extends: .flutter_env
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  before_script:
    - echo "Using optimized Linux build environment..."
    - flutter --version
    - ./scripts/setup-ci-dependencies.sh
  script:
    - export VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')
    - export BUILD=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $2}')
    - echo "Building Gecko Linux Desktop v${VERSION}+${BUILD}"
    
    - flutter build linux --release --build-name=$VERSION --build-number=$BUILD
    
    # Create AppImage or tar.gz
    - mkdir -p artifacts/linux
    - cd build/linux/x64/release/bundle
    - tar -czf ../../../../../artifacts/linux/gecko-${VERSION}+${BUILD}-linux-x64.tar.gz .
    - cd -
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

# Complete Release Flow - Manual trigger for full release process
release:complete:
  stage: publish
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
    - when: never
  script:
    - echo "Starting complete release flow..."
    - echo "This job triggers all release jobs in the correct order"
    - echo "APK builds will be triggered"
    - echo "Forum publication will be triggered"
    - echo "Play Store deployment will be triggered"
    - echo "App Store deployment will be triggered"
    - echo "Linux build will be triggered"
    - echo "GitLab release will be created"
    - echo "Please create a Git tag to trigger the actual release pipeline"
    - echo "Example git tag v0.2.20 && git push origin v0.2.20"
  needs: []

# Deploy to Google Play Store (optimized with pre-installed fastlane)
deploy:android:playstore:
  extends: .android_env
  stage: deploy
  dependencies:
    - build:android:bundle
  needs:
    - job: build:android:bundle
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  before_script:
    - echo "Using optimized deployment environment..."
    - fastlane --version
  script:
    - export VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')
    - export BUILD=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $2}')
    
    # Create Google Play API key file from base64 encoded CI variable
    - echo "$GOOGLE_PLAY_JSON_KEY_BASE64" | base64 -d > google-play-key.json
    
    # Deploy using fastlane
    - |
      fastlane supply \
        --aab "artifacts/android/gecko-${VERSION}+${BUILD}.aab" \
        --track "${GOOGLE_PLAY_TRACK:-internal}" \
        --package_name "$ANDROID_PACKAGE_NAME" \
        --json_key "google-play-key.json" \
        --release_status "${GOOGLE_PLAY_RELEASE_STATUS:-completed}" \
        --skip_upload_metadata \
        --skip_upload_images \
        --skip_upload_screenshots \
        --skip_upload_changelogs
  after_script:
    - rm -f google-play-key.json

# Deploy to App Store Connect
deploy:ios:appstore:
  stage: deploy
  tags:
    - macos
    - shared
  dependencies:
    - build:ios
  needs:
    - job: build:ios
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  before_script:
    # Install fastlane on macOS
    - gem install fastlane -NV
  script:
    - export VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $1}')
    - export BUILD=$(grep "version:" pubspec.yaml | awk '{print $2}' | awk -F'+' '{print $2}')
    
    # Create App Store Connect API key file from base64 encoded CI variable
    - echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > app-store-key.p8
    
    # Create API key JSON for fastlane
    - |
      cat > api_key.json << EOF
      {
        "key_id": "$APP_STORE_CONNECT_API_KEY_ID",
        "issuer_id": "$APP_STORE_CONNECT_API_ISSUER_ID",
        "key": "$(cat app-store-key.p8)"
      }
      EOF
    
    # Deploy using fastlane
    - |
      fastlane deliver \
        --api_key_path "api_key.json" \
        --app_identifier "$IOS_APP_IDENTIFIER" \
        --ipa "artifacts/ios/gecko-${VERSION}+${BUILD}.ipa" \
        --skip_screenshots \
        --skip_metadata \
        --precheck_include_in_app_purchases false \
        --force \
        --submit_for_review \
        --automatic_release false
  after_script:
    - rm -f app-store-key.p8 api_key.json



# Create GitLab Release with all assets
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build:android:apk
    - build:android:bundle
    - build:ios
    - build:linux
  needs:
    - job: build:android:apk
    - job: build:android:bundle
    - job: build:ios
    - job: build:linux
    - job: publish:forum:complete
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  script:
    - apk update && apk add git
    - export VERSION=$(cat artifacts/version.txt)
    
    # Generate changelog
    - git fetch --tags
    - LAST_VERSION=$(git tag --sort=-v:refname | sed -n '2p')
    - |
      if [ -n "$LAST_VERSION" ]; then
        git log --pretty="format:- %s ([%h]($CI_PROJECT_URL/-/commit/%h))" HEAD...$LAST_VERSION --reverse > release_description.txt
      else
        echo "Initial release" > release_description.txt
      fi
  release:
    name: "Gecko v$CI_COMMIT_TAG"
    description: |
      ## What's New
      
      $(cat release_description.txt)
      
      ## Downloads
      
      ### Android
      - **Google Play Store**: Available through the Play Store app
      - **Direct APK downloads**: See assets below
      
      ### iOS
      - **App Store**: Available through the App Store app
      
      ### Linux Desktop
      - **tar.gz archive**: See assets below
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        # Android APKs
        - name: "Gecko v$CI_COMMIT_TAG APK (ARMv7)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/artifacts/android/gecko-${VERSION}-v7a.apk?job=build:android:apk"
          link_type: "package"
        - name: "Gecko v$CI_COMMIT_TAG APK (ARM64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/artifacts/android/gecko-${VERSION}-v8a.apk?job=build:android:apk"
          link_type: "package"
        - name: "Gecko v$CI_COMMIT_TAG APK (x86_64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/artifacts/android/gecko-${VERSION}-x86_64.apk?job=build:android:apk"
          link_type: "package"
        # Linux Desktop
        - name: "Gecko v$CI_COMMIT_TAG Linux Desktop (x64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/artifacts/linux/gecko-${VERSION}-linux-x64.tar.gz?job=build:linux"
          link_type: "package"

# --- iOS IPA (App Store / TestFlight) ---
build:ios:
  stage: build
  tags: [macos, ios]
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  before_script:
    # 1) Install FVM if not present
    - |
      if ! command -v fvm >/dev/null 2>&1; then
        echo "Installing FVM locally..."
        # Download and install FVM locally without sudo - keep full structure
        mkdir -p "$HOME/.fvm_install"
        cd "$HOME/.fvm_install"
        curl -fsSL "https://github.com/leoafarias/fvm/releases/download/3.2.1/fvm-3.2.1-macos-arm64.tar.gz" -o fvm.tar.gz
        tar -xzf fvm.tar.gz
        rm fvm.tar.gz
        # Create symlink to the fvm binary in a bin directory
        mkdir -p "$HOME/.fvm_bin"
        ln -sf "$HOME/.fvm_install/fvm/fvm" "$HOME/.fvm_bin/fvm"
        ls -la "$HOME/.fvm_bin/"
        ls -la "$HOME/.fvm_install/fvm/"
        export PATH="$HOME/.fvm_bin:$PATH"
      fi
    # 2) Ensure FVM is in PATH for all subsequent commands
    - export PATH="$HOME/.fvm_bin:$PATH"
    # 3) Install and use Flutter version from .fvmrc
    - cd "$CI_PROJECT_DIR"
    - fvm install
    - fvm use --force
    # 4) Setup CI dependencies (removes local durt2 override, uses pub.dev version)
    - ./scripts/setup-ci-dependencies.sh
    # 5) iOS setup
    - fvm flutter doctor -v
    # Optional: explicitly set Xcode if needed
    # export DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
  script:
    - export PATH="$HOME/.fvm_bin:$PATH"
    - export VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | awk -F'+' '{print $1}')
    - export BUILD=$(awk '/^version:/{print $2}' pubspec.yaml | awk -F'+' '{print $2}')
    - echo "Building Gecko iOS IPA v${VERSION}+${BUILD}"
    # Build IPA (codesign expected to be already set up on the machine)
    - fvm flutter build ipa --release --build-name="$VERSION" --build-number="$BUILD" --export-options-plist=ios/ExportOptions.plist
    # Artifacts
    - mkdir -p artifacts/ios artifacts
    - IPA_OUT=$(ls -1 build/ios/ipa/*.ipa | head -n1)
    - mv "$IPA_OUT" "artifacts/ios/gecko-${VERSION}+${BUILD}.ipa"
    - echo "${VERSION}+${BUILD}" > artifacts/version.txt
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

# --- macOS (app + zip) ---
build:macos:
  stage: build
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  before_script:
    # 1) Install FVM if not present
    - |
      if ! command -v fvm >/dev/null 2>&1; then
        echo "Installing FVM locally..."
        # Download and install FVM locally without sudo - keep full structure
        mkdir -p "$HOME/.fvm_install"
        cd "$HOME/.fvm_install"
        curl -fsSL "https://github.com/leoafarias/fvm/releases/download/3.2.1/fvm-3.2.1-macos-arm64.tar.gz" -o fvm.tar.gz
        tar -xzf fvm.tar.gz
        rm fvm.tar.gz
        # Create symlink to the fvm binary in a bin directory
        mkdir -p "$HOME/.fvm_bin"
        ln -sf "$HOME/.fvm_install/fvm/fvm" "$HOME/.fvm_bin/fvm"
        ls -la "$HOME/.fvm_bin/"
        ls -la "$HOME/.fvm_install/fvm/"
        export PATH="$HOME/.fvm_bin:$PATH"
      fi
    # 2) Ensure FVM is in PATH for all subsequent commands
    - export PATH="$HOME/.fvm_bin:$PATH"
    # 3) Install and use Flutter version from .fvmrc
    - cd "$CI_PROJECT_DIR"
    - fvm install
    - fvm use --force
    # 4) Setup CI dependencies (removes local durt2 override, uses pub.dev version)
    - ./scripts/setup-ci-dependencies.sh
    # 5) macOS setup
    - fvm flutter config --enable-macos-desktop
  script:
    - export PATH="$HOME/.fvm_bin:$PATH"
    - export VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | awk -F'+' '{print $1}')
    - export BUILD=$(awk '/^version:/{print $2}' pubspec.yaml | awk -F'+' '{print $2}')
    - export ARCH=$(uname -m) # arm64 or x86_64
    - echo "Building Gecko macOS v${VERSION}+${BUILD} (${ARCH})"
    # Disable code signing for macOS build by modifying Xcode project
    - |
      sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' macos/Runner.xcodeproj/project.pbxproj
      sed -i '' 's/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
      sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' macos/Runner.xcodeproj/project.pbxproj
      sed -i '' '/CODE_SIGNING_REQUIRED/d' macos/Runner.xcodeproj/project.pbxproj
      sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' macos/Runner.xcodeproj/project.pbxproj
      # Add explicit code signing disabled settings
      sed -i '' 's/buildSettings = {/buildSettings = {\
        CODE_SIGNING_REQUIRED = NO;\
        CODE_SIGNING_ALLOWED = NO;/g' macos/Runner.xcodeproj/project.pbxproj
    # Set Xcode build settings to disable code signing
    - export FLUTTER_XCODE_CODE_SIGN_IDENTITY=""
    - export FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO
    - export FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO
    - fvm flutter build macos --release --build-name="$VERSION" --build-number="$BUILD" --dart-define=FLUTTER_XCODE_CODE_SIGN_IDENTITY="" --dart-define=FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO
    # Package the app (.zip)
    - mkdir -p artifacts/macos artifacts
    - APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
    - test -d "$APP_PATH"
    - pushd "$(dirname "$APP_PATH")"
    - zip -r "$CI_PROJECT_DIR/artifacts/macos/gecko-${VERSION}+${BUILD}-macos-${ARCH}.zip" "$(basename "$APP_PATH")"
    - popd
    - echo "${VERSION}+${BUILD}" > artifacts/version.txt
    # Restore original Xcode project
    - git checkout macos/Runner.xcodeproj/project.pbxproj || true
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

# Cleanup old artifacts (optional)
cleanup:artifacts:
  image: alpine:latest
  stage: .post
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - echo "Cleanup job for scheduled pipelines"
    # Add cleanup logic here if needed
