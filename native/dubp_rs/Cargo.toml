[package]
name = "dubp_rs"
version = "0.1.0"
authors = ["Éloïs SANCHEZ <elois@duniter.org>"]
edition = "2018"

[lib]
name = "dubp_rs"
crate-type = ["rlib"]

[dependencies]
allo-isolate = "0.1.6"
dup-crypto = { version = "0.41.1", features = ["bip32-ed25519", "dewif", "mnemonic", "mnemonic_french", "rand", "scrypt"] }
fast-threadpool = { version = "0.3.0", default-features = false }
once_cell = { version = "1.3.1", default-features = false, features = ["std"] }
thiserror = "1.0.23"

[build-dependencies]
cbindgen = "0.14.3"
dart-bindgen = "0.1.7"