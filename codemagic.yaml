workflows:
  windows-release:
    name: Windows Desktop Release
    instance_type: windows_x2
    max_build_duration: 60

    # Only triggered via API from GitLab CI
    triggering:
      events: []

    environment:
      flutter: stable

    scripts:
      - name: Remove local dependency overrides
        script: |
          $content = Get-Content pubspec.yaml -Raw
          $content = $content -replace '(?m)^\s*# Local development override - use local durt2 when available\r?\n\s*durt2:\r?\n\s*path: \.\./durt2\r?\n', ''
          Set-Content pubspec.yaml -Value $content -NoNewline
          Write-Host "Local overrides removed - using pub.dev dependencies"

      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Build Windows release
        script: flutter build windows --release

      - name: Install Inno Setup
        script: |
          choco install innosetup -y --no-progress
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $ISCC)) {
            Write-Error "Inno Setup not found at $ISCC"
            exit 1
          }
          Write-Host "Inno Setup installed at $ISCC"

      - name: Download VC++ Redistributable
        script: |
          New-Item -ItemType Directory -Force -Path "dependencies"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dependencies\vc_redist.x64.exe"
          if (-not (Test-Path "dependencies\vc_redist.x64.exe")) {
            Write-Error "Failed to download VC++ Redistributable"
            exit 1
          }
          $size = (Get-Item "dependencies\vc_redist.x64.exe").Length / 1MB
          Write-Host "VC++ Redistributable downloaded (${size} MB)"

      - name: Package Windows installer
        script: |
          $VERSION = (Select-String -Path pubspec.yaml -Pattern '^version:\s+(.+)$').Matches.Groups[1].Value
          $VERSION_NAME = $VERSION.Split('+')[0]
          $BUILD_NUMBER = $VERSION.Split('+')[1]

          $ARTIFACT_DIR = "artifacts\windows"
          New-Item -ItemType Directory -Force -Path $ARTIFACT_DIR

          # Verify Flutter build output exists
          $BUNDLE_PATH = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$BUNDLE_PATH\gecko.exe")) {
            Write-Error "Flutter build output not found at $BUNDLE_PATH"
            exit 1
          }

          # Build installer with Inno Setup
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC /DMyAppVersion=$VERSION_NAME /DMyAppBuildNumber=$BUILD_NUMBER "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Installer built: $ARTIFACT_DIR\gecko-${VERSION_NAME}+${BUILD_NUMBER}-windows-x64-setup.exe"

          # Also keep the zip for portable usage
          $ZIP_NAME = "gecko-${VERSION_NAME}+${BUILD_NUMBER}-windows-x64.zip"
          7z a "$ARTIFACT_DIR\$ZIP_NAME" ".\$BUNDLE_PATH\*"

          Write-Host "Portable zip: $ARTIFACT_DIR\$ZIP_NAME"

    artifacts:
      - artifacts/windows/*.exe
      - artifacts/windows/*.zip
