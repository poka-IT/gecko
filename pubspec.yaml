name: gecko
description: Pay with G1.
publish_to: "none"

version: 1.2.6+192

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bubble: ^1.2.1
  calendar_date_picker2: ^2.0.1
  carousel_slider: ^5.1.2
  graphql_flutter: ^5.3.0
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  jdenticon_dart: ^2.0.0
  logger: ^2.7.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^12.0.1
  printing: ^5.14.3
  provider: ^6.1.5+1
  barcode_scan2: ^4.7.2
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  responsive_framework: ^1.5.1
  sentry_flutter: ^9.16.1
  truncate: ^3.0.1
  dio: ^5.9.2
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  dots_indicator: ^4.0.1
  connectivity_plus: ^7.1.0
  image_cropper: ^12.2.0
  easy_localization: ^3.0.8
  flutter_markdown: ^0.7.7+1
  pointycastle: ^4.0.0
  accordion: ^2.6.0
  flutter_svg: ^2.2.4
  pinenacl: ^0.6.0
  tutorial_coach_mark: ^1.3.3
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  flutter_typeahead: ^6.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  screen_brightness: ^2.1.7
  local_auth: ^3.0.1
  uuid: ^4.5.3
  markdown: ^7.3.1
  http: ^1.6.0
  gif_view: ^1.0.3
  get_it: ^9.2.1
  durt2: ^1.1.6
  flutter_riverpod: ^3.3.1
  riverpod_sqflite: ^0.4.2
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  visibility_detector: ^0.4.0+2
  audioplayers: ^6.6.0
  local_auth_android: ^2.0.7
  local_auth_ios: ^1.1.7
  google_mlkit_text_recognition: ^0.15.1
  camera: ^0.12.0+1
  flutter_native_splash: ^2.4.7
  in_app_update: ^4.2.5
  window_manager: ^0.5.1
  timeago: ^3.7.1
  clipboard_watcher: ^0.3.0
  flutter_nfc_kit: ^3.6.2
  ndef: ^0.4.0
  app_links: ^7.0.0

dependency_overrides:
  intl: ^0.20.0
  # Local development override - use local durt2 when available
  durt2:
    path: ../durt2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.13.1
  # hive_generator: ^2.0.1 # Commented out: requires build ^2.0.0, incompatible with polkadart 1.0.0 (needs build ^4.0.3)
  flutter_lints: ^6.0.0
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # dart_code_linter: ^2.0.0 # Commented out: requires analyzer ^6.0.0, incompatible with polkadart 1.0.0 (needs analyzer >=9.0.0)

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/gecko_flat_background.png"
  remove_alpha_ios: true
  adaptive_icon_background: "transparent"
  adaptive_icon_foreground: "assets/icon/gecko_flat.png"
  min_sdk_android: 23
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true
  linux:
    generate: false

uses-material-design: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  project: axiom-team
  org: axiom-team
  wait_for_processing: false
  log_level: warn
  ignore_missing: true

flutter_native_splash:
  color: "#FFD68E"
  image: assets/icon/gecko_final_padded.png
  android: true
  ios: true
  android_12:
    color: "#FFD68E"
    image: assets/icon/gecko_final_padded.png

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
    - assets/home/
    - assets/avatars/
    - assets/safes/
    - assets/icon/
    - assets/onBoarding/
    - assets/walletOptions/
    - assets/sounds/
    - assets/background-easter/
    - assets/gecko-wisdom/
