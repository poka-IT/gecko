name: gecko
description: Pay with G1.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.11+29

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  bubble: ^1.2.1
  carousel_slider: ^4.0.0
  flutter_lints: ^2.0.1
  graphql_flutter: ^5.1.1-beta.3
  hive_flutter: ^1.1.0
  image_picker: ^0.8.4
  jdenticon_dart: ^2.0.0
  logger: ^1.1.0
  path_provider: ^2.0.9
  pdf: ^3.7.1
  permission_handler: ^10.0.0
  pin_code_fields: ^7.3.0
  printing: ^5.9.1
  provider: ^6.0.1
  barcode_scan2: ^4.2.1
  qr_flutter: #^4.0.0
    git:
      url: https://github.com/insinfo/qr.flutter.git
      ref: master
  responsive_framework: ^0.2.0
  sentry_flutter: ^6.5.1
  shared_preferences: ^2.0.7
  truncate: ^3.0.1
  unorm_dart: ^0.2.0
  dio: ^4.0.4
  durt: ^0.1.6
  package_info_plus: ^1.4.2
  polkawallet_sdk: #^0.4.9
    git:
      # url: https://github.com/polkawallet-io/sdk.git
      # ref: develop
      url: https://github.com/poka-IT/sdk.git
      # ref: gecko-old
      ref: gecko-unwrapbytes
  dots_indicator: ^2.1.0
  connectivity_plus: ^2.3.3
  image_cropper: ^3.0.0
  easy_localization: ^3.0.1
  flutter_markdown: ^0.6.10+2
  pointycastle: ^3.6.1
  hex: ^0.2.0
  flutter_dotenv: ^5.0.2

dev_dependencies:
  # flutter_launcher_icons: ^0.9.2
  # flutter_launcher_icons_maker: ^^0.10.2
  icons_launcher: ^2.0.2
  build_runner: ^2.1.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/gecko_flat.png"
  remove_alpha_ios: true

uses-material-design: true

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - config/
    - assets/
    - assets/translations/
    - assets/home/
    - assets/avatars/
    - assets/chests/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - sounds/
    - .env
