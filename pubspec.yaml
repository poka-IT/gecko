name: gecko
description: Pay with G1.
publish_to: "none"

version: 0.2.19+143

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  bubble: ^1.2.1
  carousel_slider: ^5.1.1
  graphql_flutter: ^5.2.0
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  jdenticon_dart: ^2.0.0
  logger: ^2.6.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.1
  printing: ^5.14.2
  provider: ^6.1.5
  barcode_scan2: ^4.5.1
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  responsive_framework: ^1.5.1
  sentry_flutter: ^9.4.1
  truncate: ^3.0.1
  unorm_dart: ^0.3.1+1
  dio: ^5.8.0+1
  package_info_plus: ^8.3.0
  dots_indicator: ^4.0.1
  connectivity_plus: ^6.1.4
  image_cropper: ^9.1.0
  easy_localization: ^3.0.7+1
  flutter_markdown: ^0.7.7+1
  pointycastle: ^3.9.1
  hex: ^0.2.0
  accordion: ^2.6.0
  flutter_svg: ^2.2.0
  pinenacl: ^0.6.0
  fast_base58: ^0.2.1
  tutorial_coach_mark: ^1.3.0
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  screen_brightness: ^2.1.5
  local_auth: ^2.3.0
  uuid: ^4.5.1
  fade_and_translate: ^0.1.3
  markdown: ^7.3.0
  http: ^1.4.0
  gif_view: ^1.0.3
  get_it: ^8.0.3
  durt2:
    path: ../durt2
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  visibility_detector: ^0.4.0+2
  audioplayers: ^6.5.0
  local_auth_android: ^1.0.50
  local_auth_ios: ^1.1.7
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.11.2

dependency_overrides:
  intl: ^0.19.0
  # To keep compatibility with polkadart_cli and Hive
  source_gen: ^2.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.5.4
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  dart_code_linter: ^2.0.0

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/gecko_flat_background.png"
  remove_alpha_ios: true
  adaptive_icon_background: "transparent"
  adaptive_icon_foreground: "assets/icon/gecko_flat.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: true
  linux:
    generate: false

uses-material-design: true

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/translations/
    - assets/home/
    - assets/avatars/
    - assets/safes/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - assets/sounds/
    - assets/background-easter/
    - assets/gecko-wisdom/
