name: gecko
description: Pay with G1.
publish_to: "none"

version: 0.1.7+78

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  bubble: ^1.2.1
  carousel_slider: ^4.2.1
  graphql_flutter: ^5.2.0-beta.6
  hive_flutter: ^1.1.0
  image_picker: ^1.1.0
  jdenticon_dart: ^2.0.0
  logger: ^2.2.0
  path_provider: ^2.1.3
  pdf: ^3.10.8
  permission_handler: ^11.3.1
  pin_code_fields: ^8.0.1
  printing: ^5.12.0
  provider: ^6.1.2
  barcode_scan2: ^4.3.0
  qr_flutter: ^4.1.0
  responsive_framework: ^1.4.0
  sentry_flutter: ^7.20.0
  truncate: ^3.0.1
  unorm_dart: ^0.2.0
  dio: ^5.4.3+1
  durt: ^0.1.8
  package_info_plus: ^7.0.0
  polkawallet_sdk: #^0.5.2
    git:
      # url: https://github.com/polkawallet-io/sdk.git
      # ref: develop
      url: https://github.com/poka-IT/sdk.git
      # ref: gecko-fixes-3
      ref: fcfdb5e9f214c99c8d3a97d3aea38a67ea1fa6a5
  dots_indicator: ^3.0.0
  connectivity_plus: ^5.0.2
  image_cropper: ^5.0.1
  easy_localization: ^3.0.5
  flutter_markdown: ^0.7.1
  pointycastle: ^3.9.0
  hex: ^0.2.0
  accordion: ^2.6.0
  flutter_svg: ^2.0.10+1
  pinenacl: ^0.5.1
  fast_base58: ^0.2.1
  tutorial_coach_mark: ^1.2.11
  confetti: ^0.7.0
  url_launcher: ^6.2.6
  crypto: ^3.0.3
  screen_brightness: ^1.0.1
  uuid: ^4.4.0
  fade_and_translate: ^0.1.3
  durt2:
    path: ../../durt2
    # git:
    #   url: https://git.duniter.org/libs/durt2

dev_dependencies:
  icons_launcher: ^2.1.7
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

icons_launcher:
  image_path: "assets/icon/gecko_flat.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

uses-material-design: true

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - config/
    - assets/
    - assets/translations/
    - assets/home/
    - assets/avatars/
    - assets/chests/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - sounds/
