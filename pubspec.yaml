name: gecko
description: Pay with G1.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.1.0+56

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  bubble: ^1.2.1
  carousel_slider: ^4.0.0
  flutter_lints: ^2.0.1
  graphql_flutter: ^5.1.1-beta.4
  hive_flutter: ^1.1.0
  image_picker: ^0.8.4
  jdenticon_dart: ^2.0.0
  logger: ^1.1.0
  path_provider: ^2.0.11
  pdf: ^3.7.1
  permission_handler: ^10.0.0
  pin_code_fields: ^7.4.0
  printing: ^5.10.1
  provider: ^6.0.1
  barcode_scan2: ^4.2.1
  qr_flutter: #^4.0.0
    git:
      url: https://github.com/insinfo/qr.flutter.git
      ref: master
  responsive_framework: ^0.2.0
  sentry_flutter: ^6.18.0
  shared_preferences: ^2.0.7
  truncate: ^3.0.1
  unorm_dart: ^0.2.0
  dio: ^5.0.1
  durt: ^0.1.6
  package_info_plus: ^3.0.2
  polkawallet_sdk: #^0.5.2
    git:
      # url: https://github.com/polkawallet-io/sdk.git
      # ref: develop
      url: https://github.com/poka-IT/sdk.git
      # ref: gecko-fixes
      ref: 2e42824adf778c118248ba559be32208e9d9a650
  dots_indicator: ^2.1.0
  connectivity_plus: ^3.0.2
  image_cropper: ^3.0.0
  easy_localization: ^3.0.1
  flutter_markdown: ^0.6.10+2
  pointycastle: ^3.6.1
  hex: ^0.2.0
  flutter_dotenv: ^5.0.2
  accordion: ^2.5.1
  flutter_svg: ^2.0.2
  pinenacl: ^0.3.3
  fast_base58: ^0.2.1
  graphql: ^5.1.1
  hive_generator: ^2.0.0
  riverpod: ^2.1.1
  tutorial_coach_mark: ^1.2.4

dev_dependencies:
  # flutter_launcher_icons: ^0.9.2
  # flutter_launcher_icons_maker: ^^0.10.2
  flutter_launcher_icons: ^0.12.0
  icons_launcher: ^2.0.6
  build_runner: ^2.1.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  dart_code_metrics: ^5.0.1

icons_launcher:
  image_path: 'assets/icon/gecko_flat.png'
  platforms:
    android:
      enable: true
    ios:
      enable: true

# flutter_icons:
#   android: "launcher_icon"
#   ios: true
#   image_path: "assets/icon/gecko_flat.png"
#   min_sdk_android: 21
#   remove_alpha_ios: true

uses-material-design: true

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - config/
    - assets/
    - assets/translations/
    - assets/home/
    - assets/avatars/
    - assets/chests/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - sounds/
    - .env
