name: gecko
description: Pay with G1.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+23

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dubp:
    path: packages/dubp_rs
  flutter_launcher_icons: "^0.9.0"
  qrscan: ^0.2.22
  permission_handler: ^6.0.1
  image_gallery_saver: ^1.6.8
  image_picker: ^0.7.3
  # graphql_flutter: ^4.0.1 #^3.1.0
  graphql_flutter: ^5.0.0-nullsafety.1
  provider: ^4.3.2+3
  truncate: ^2.1.2
  path_provider: ^2.0.1
  intl: ^0.17.0
  pin_code_fields: ^6.0.2
  http: ^0.13.0
  super_tooltip: ^0.9.6
  package_info: ^0.4.3+2
  xml: ^5.0.2
  pdf: ^3.0.1
  printing: ^5.0.2
  shared_preferences: ^2.0.3
  sync_http: ^0.2.0
  crypto: ^3.0.0
  fast_base58:
  logger: ^1.0.0
  flutter_logs: ^2.1.3
  sentry: ^4.0.4
  sentry_flutter: ^4.0.4
  bubble: ^1.1.9+1
  flutter_svg: ^0.20.0-nullsafety
  responsive_framework: ^0.0.14
  responsive_builder: ^0.3.0
  jdenticon_dart: ^2.0.0

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/gecko_final.png"
  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - images/
    - config/gva_endpoints.json
    - assets/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
