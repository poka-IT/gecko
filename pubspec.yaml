name: gecko
description: Pay with G1.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.5+1

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:  
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  window_size:
    git:
      url: git://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
  assorted_layout_widgets: ^5.2.1
  bubble: ^1.2.1
  carousel_slider: ^4.0.0
  confirm_dialog: ^1.0.0
  crypto: ^3.0.1
  fast_base58: ^0.2.0
  flutter_lints: ^1.0.4
  flutter_logs: ^2.1.4
  flutter_svg: ^0.22.0
  graphql_flutter: ^5.0.0
  hive: ^2.0.4
  hive_flutter: ^1.1.0
  http: ^0.13.4
  image_gallery_saver: ^1.6.9
  image_picker: ^0.8.4
  infinite_scroll_pagination: ^3.1.0
  intl: ^0.17.0
  jdenticon_dart: ^2.0.0
  logger: ^1.1.0
  path_provider: ^2.0.9
  pdf: ^3.7.1
  permission_handler: ^8.3.0
  pin_code_fields: ^7.3.0
  printing: ^5.7.2
  provider: ^6.0.1
  # qrscan: ^0.3.2
  qrscan:
    git:
      url: git://github.com/leyan95/qrcode_scanner.git
      ref: master # branch name
  # qr_code_scanner: ^0.6.1
  # qr_flutter: ^4.0.0
  qr_flutter:
    git:
      url: git://github.com/insinfo/qr.flutter.git
      ref: master # branch name
  responsive_builder: ^0.4.1
  responsive_framework: ^0.1.4
  sentry: ^6.0.0
  sentry_flutter: ^6.0.0
  shared_preferences: ^2.0.7
  super_tooltip: ^1.0.1
  sync_http: ^0.3.0
  test: ^1.17.10
  truncate: ^3.0.1
  unorm_dart: ^0.2.0
  xml: ^5.3.0
  pull_to_refresh: ^2.0.0
  dio: ^4.0.4
  desktop_window: ^0.4.0
  durt: ^0.1.6
  package_info_plus: ^1.4.2
  polkawallet_sdk: #^0.4.1 ## Wait for merging PR: https://github.com/polkawallet-io/sdk/pull/19
    # path: ../substrate-sdk
    git:
      url: git://github.com/poka-IT/sdk.git
      ref: fixAndroidActivityVersion

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/gecko_flat.png"
  remove_alpha_ios: true

dev_dependencies:
  icons_launcher: ^1.1.3
  build_runner: ^2.1.2
  flutter_test:
    sdk: flutter
  hive_generator: ^1.1.1
  integration_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - images/
    - config/gva_endpoints.json
    - assets/
    - assets/home/
    - assets/avatars/
    - assets/chests/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - sounds/
