# Create GitLab Release with all assets
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build:android:apk
    - build:android:bundle
    # - build:ios
    - build:linux
    - build:macos
  needs:
    - job: build:android:apk
    - job: build:android:bundle
    # - job: build:ios
    - job: build:linux
    - job: build:macos
    - job: publish:forum:complete
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: never
  script:
    - apk update && apk add git
    - export VERSION=$(cat artifacts/version.txt)
    - export APK_JOB_ID=$(cat artifacts/apk_job_id.txt)
    - export LINUX_JOB_ID=$(cat artifacts/linux_job_id.txt)
    - export MACOS_JOB_ID=$(cat artifacts/macos_job_id.txt)
    
    # Generate changelog
    - git fetch --tags
    - LAST_VERSION=$(git tag --sort=-v:refname | sed -n '2p')
    - |
      if [ -n "$LAST_VERSION" ]; then
        git log --pretty="format:- %s ([%h]($CI_PROJECT_URL/-/commit/%h))" HEAD...$LAST_VERSION --reverse > release_description.txt
      else
        echo "Initial release" > release_description.txt
      fi
  release:
    name: "Gecko v$CI_COMMIT_TAG"
    description: |
      ## What's New
      
      $(cat release_description.txt)
      
      ## Downloads
      
      ### Android
      - **Google Play Store**: Available through the Play Store app
      - **Direct APK downloads**: See assets below
      
      ### iOS
      - **App Store**: Available through the App Store app
      
      ### Desktop
      - **Linux (x64)**: tar.gz archive below
      - **macOS (Apple Silicon)**: zip archive below
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        # Android APKs
        - name: "Gecko v$CI_COMMIT_TAG APK (ARMv7)"
          url: "$CI_PROJECT_URL/-/jobs/${APK_JOB_ID}/artifacts/raw/artifacts/android/gecko-${VERSION}-v7a.apk"
          link_type: "package"
        - name: "Gecko v$CI_COMMIT_TAG APK (ARM64)"
          url: "$CI_PROJECT_URL/-/jobs/${APK_JOB_ID}/artifacts/raw/artifacts/android/gecko-${VERSION}-v8a.apk"
          link_type: "package"
        - name: "Gecko v$CI_COMMIT_TAG APK (x86_64)"
          url: "$CI_PROJECT_URL/-/jobs/${APK_JOB_ID}/artifacts/raw/artifacts/android/gecko-${VERSION}-x86_64.apk"
          link_type: "package"
        # Linux Desktop
        - name: "Gecko v$CI_COMMIT_TAG Linux Desktop (x64)"
          url: "$CI_PROJECT_URL/-/jobs/${LINUX_JOB_ID}/artifacts/raw/artifacts/linux/gecko-${VERSION}-linux.tar.gz"
          link_type: "package"
        # macOS Desktop
        - name: "Gecko v$CI_COMMIT_TAG macOS Desktop (Apple Silicon)"
          url: "$CI_PROJECT_URL/-/jobs/${MACOS_JOB_ID}/artifacts/raw/artifacts/macos/gecko-${VERSION}-macos-arm64.zip"
          link_type: "package"

# --- macOS (app + zip) ---
build:macos:
  stage: build
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: manual
  before_script:
    # Install Flutter on macOS if not present
    - |
      if ! command -v flutter &> /dev/null; then
        echo "Installing Flutter..."
        if [ -d "$HOME/flutter" ]; then
          echo "Flutter directory exists, updating..."
          cd $HOME/flutter && git pull origin stable && cd $CI_PROJECT_DIR
        else
          git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
        fi
        export PATH="$PATH:$HOME/flutter/bin"
      fi
    - flutter --version
    - pwd
    - ls -la scripts/
    - chmod +x scripts/setup-ci-dependencies.sh
    - ./scripts/setup-ci-dependencies.sh
    - flutter config --enable-macos-desktop
    
    # Setup code signing for release builds
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        echo "🔐 Setting up macOS code signing for release..."
        
        # Create temporary keychain
        KEYCHAIN_NAME="build.keychain-db"
        KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-temp-password}"
        
        # Delete existing keychain if it exists
        security delete-keychain "$KEYCHAIN_NAME" 2>/dev/null || true
        
        # Create new keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        
        # Add keychain to search list
        security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | sed s/\"//g)
        
        # Import certificate
        echo "$MACOS_CERTIFICATE_BASE64" | base64 -d > certificate.p12
        security import certificate.p12 -k "$KEYCHAIN_NAME" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        
        # Set partition list for codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        
        # Clean up certificate file
        rm certificate.p12
        
        echo "✅ Code signing setup complete"
      else
        echo "ℹ️  Non-release build, skipping code signing setup"
      fi
    
    # Clean CocoaPods cache and update for Sentry version downgrade
    - cd macos && rm -rf Pods Podfile.lock && cd ..
    # Fix UTF-8 encoding for CocoaPods
    - export LANG=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
    - pod repo update
    - pod cache clean --all || true
    # Pre-install pods with retry logic for network issues
    - |
      cd macos
      export LANG=en_US.UTF-8
      export LC_ALL=en_US.UTF-8
      for i in {1..3}; do
        echo "Pod install attempt $i/3..."
        if pod install --repo-update; then
          echo "✅ Pod install successful"
          break
        else
          echo "❌ Pod install failed, attempt $i/3"
          if [ $i -eq 3 ]; then
            echo "💥 All pod install attempts failed"
            exit 1
          fi
          sleep 10
        fi
      done
      cd ..
  script:
    - export PATH="$PATH:$HOME/flutter/bin"
    - export VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | awk -F'+' '{print $1}')
    - export BUILD=$(awk '/^version:/{print $2}' pubspec.yaml | awk -F'+' '{print $2}')
    - export ARCH="arm64" # Only build for Apple Silicon
    - echo "Building Gecko macOS v${VERSION}+${BUILD} (${ARCH})"
    
    # Configure code signing based on build type
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        echo "🔐 Configuring code signing for release build..."
        
        # Enable code signing for release builds
        sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "'"${MACOS_SIGNING_IDENTITY}"'";/g' macos/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "'"${MACOS_DEVELOPER_ID}"'";/g' macos/Runner.xcodeproj/project.pbxproj
        
        # Set Flutter build environment for code signing
        export FLUTTER_XCODE_CODE_SIGN_IDENTITY="${MACOS_SIGNING_IDENTITY}"
        export FLUTTER_XCODE_DEVELOPMENT_TEAM="${MACOS_DEVELOPER_ID}"
        
        # Build with code signing
        flutter build macos --release --build-name="$VERSION" --build-number="$BUILD"
        
        echo "✅ Release build completed with code signing"
      else
        echo "ℹ️  Building without code signing for non-release..."
        
        # Disable code signing for non-release builds
        sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' macos/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj
        sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' macos/Runner.xcodeproj/project.pbxproj
        sed -i '' '/CODE_SIGNING_REQUIRED/d' macos/Runner.xcodeproj/project.pbxproj
        sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' macos/Runner.xcodeproj/project.pbxproj
        
        # Add explicit code signing disabled settings
        sed -i '' 's/buildSettings = {/buildSettings = {\
          CODE_SIGNING_REQUIRED = NO;\
          CODE_SIGNING_ALLOWED = NO;/g' macos/Runner.xcodeproj/project.pbxproj
        
        # Set Xcode build settings to disable code signing
        export FLUTTER_XCODE_CODE_SIGN_IDENTITY=""
        export FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO
        export FLUTTER_XCODE_CODE_SIGNING_ALLOWED=NO
        
        # Build without code signing
        flutter build macos --release --build-name="$VERSION" --build-number="$BUILD" --dart-define=FLUTTER_XCODE_CODE_SIGN_IDENTITY="" --dart-define=FLUTTER_XCODE_CODE_SIGNING_REQUIRED=NO
        
        echo "✅ Non-release build completed without code signing"
      fi
    # Package the app (.zip)
    - mkdir -p artifacts/macos artifacts
    - APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n1)
    - test -d "$APP_PATH"
    
    # Optional: Notarize the app for release builds
    - |
      if [ "$CI_COMMIT_TAG" ] && [ -n "${APPLE_ID_EMAIL:-}" ] && [ -n "${APPLE_ID_APP_PASSWORD:-}" ]; then
        echo "🍎 Starting notarization process..."
        
        # Create a zip for notarization (required format)
        NOTARIZE_ZIP="$CI_PROJECT_DIR/artifacts/macos/gecko-${VERSION}+${BUILD}-macos-${ARCH}-notarize.zip"
        pushd "$(dirname "$APP_PATH")"
        zip -r "$NOTARIZE_ZIP" "$(basename "$APP_PATH")"
        popd
        
        # Submit for notarization
        xcrun notarytool submit "$NOTARIZE_ZIP" \
          --apple-id "$APPLE_ID_EMAIL" \
          --password "$APPLE_ID_APP_PASSWORD" \
          --team-id "$MACOS_DEVELOPER_ID" \
          --wait
        
        # Staple the notarization to the app
        xcrun stapler staple "$APP_PATH"
        
        echo "✅ Notarization completed"
        
        # Remove the notarization zip (we'll create a new one below)
        rm "$NOTARIZE_ZIP"
      else
        echo "ℹ️  Skipping notarization (missing credentials or non-release build)"
      fi
    
    # Create final distribution zip
    - pushd "$(dirname "$APP_PATH")"
    - zip -r "$CI_PROJECT_DIR/artifacts/macos/gecko-${VERSION}+${BUILD}-macos-${ARCH}.zip" "$(basename "$APP_PATH")"
    - popd
    - echo "${VERSION}+${BUILD}" > artifacts/version.txt
    
    # Store job ID for forum publishing
    - echo "$CI_JOB_ID" > artifacts/macos_job_id.txt
    
  after_script:
    # Clean up keychain and restore original Xcode project
    - security delete-keychain "build.keychain-db" 2>/dev/null || true
    - git checkout macos/Runner.xcodeproj/project.pbxproj || true
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 month

# Cleanup old artifacts (optional)
cleanup:artifacts:
  image: alpine:latest
  stage: .post
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - echo "Cleanup job for scheduled pipelines"
    # Add cleanup logic here if needed

