name: gecko
description: Pay with G1.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.2+6

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  bubble: ^1.2.1
  crypto: ^3.0.1
  dubp:
    path: packages/dubp_rs
  fast_base58: ^0.2.0
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.9.0
  flutter_logs: ^2.1.4
  flutter_svg: ^0.22.0
  graphql_flutter: ^5.0.0
  hive: ^2.0.4
  http: ^0.13.0
  image_gallery_saver: ^1.6.9
  image_picker: ^0.8.4
  intl: ^0.17.0
  jdenticon_dart: ^2.0.0
  logger: ^1.1.0
  package_info: ^2.0.2
  path_provider: ^2.0.3
  pdf: ^3.5.0
  permission_handler: 8.1.6
  pin_code_fields: ^6.0.2
  printing: ^5.5.0
  provider: ^6.0.0
  qrscan: ^0.3.2
  responsive_builder: ^0.4.1
  responsive_framework: ^0.1.4
  sentry: ^6.0.0
  sentry_flutter: ^6.0.0
  shared_preferences: ^2.0.7
  super_tooltip: ^1.0.1
  sync_http: ^0.3.0
  test: ^1.17.10
  # test_api: ^0.4.7
  # test: ^1.19.3
  truncate: ^3.0.1
  unorm_dart: ^0.2.0
  xml: ^5.3.0

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/gecko_final.png"
  cupertino_icons: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  uses-material-design: true

  assets:
    - images/
    - config/gva_endpoints.json
    - assets/
    - assets/icon/
    - assets/onBoarding/
    - assets/onBoarding/progress_bar/
    - assets/walletOptions/
    - sounds/
