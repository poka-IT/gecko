# Create GitLab Release with all assets
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - build:android:apk
    - build:android:bundle
    # - build:ios
    - build:linux
    # - build:macos
  needs:
    - job: build:android:apk
    - job: build:android:bundle
    # - job: build:ios
    - job: build:linux
    # - job: build:macos
    - job: publish:forum:complete
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: never
  script:
    - apk update && apk add git
    - export VERSION=$(cat artifacts/version.txt)
    # URL-encode the + character as %2B for artifact URLs
    - export VERSION_URL=$(echo "$VERSION" | sed 's/+/%2B/g')
    - export APK_JOB_ID=$(cat artifacts/apk_job_id.txt)
    - export LINUX_JOB_ID=$(cat artifacts/linux_job_id.txt)
    # - export MACOS_JOB_ID=$(cat artifacts/macos_job_id.txt)

    # Generate changelog (limited to 30 commits to avoid "Argument list too long" error)
    - git fetch --tags --unshallow || git fetch --tags
    - LAST_VERSION=$(git tag --sort=-v:refname | sed -n '2p')
    - |
      if [ -n "$LAST_VERSION" ]; then
        git log --pretty="format:- %s ([%h]($CI_PROJECT_URL/-/commit/%h))" HEAD...$LAST_VERSION --reverse | head -30 > release_description.txt
        TOTAL_COMMITS=$(git rev-list --count HEAD...$LAST_VERSION)
        if [ "$TOTAL_COMMITS" -gt 30 ]; then
          echo "" >> release_description.txt
          echo "- ... and $((TOTAL_COMMITS - 30)) more commits" >> release_description.txt
        fi
      else
        echo "- Initial release" > release_description.txt
      fi

    # Build description file
    - |
      cat > release_description_full.md << 'EOF'
      ## What's New

      EOF
    - cat release_description.txt >> release_description_full.md
    - |
      cat >> release_description_full.md << EOF

      ## Downloads

      ### Android
      - **Google Play Store**: Available through the Play Store app
      - **Direct APK downloads**: See assets below

      ### iOS
      - **App Store**: Available through the App Store app

      ### Desktop
      - **Linux (x64)**: tar.gz archive below
      EOF

    # Create release using release-cli directly (avoids "Argument list too long" error)
    # Use VERSION_URL (with + encoded as %2B) for artifact URLs
    - |
      release-cli create \
        --name "Gecko $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat release_description_full.md)" \
        --assets-link "{\"name\":\"Gecko $CI_COMMIT_TAG APK (ARMv7)\",\"url\":\"$CI_PROJECT_URL/-/jobs/$APK_JOB_ID/artifacts/raw/artifacts/android/gecko-$VERSION_URL-v7a.apk\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Gecko $CI_COMMIT_TAG APK (ARM64)\",\"url\":\"$CI_PROJECT_URL/-/jobs/$APK_JOB_ID/artifacts/raw/artifacts/android/gecko-$VERSION_URL-v8a.apk\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Gecko $CI_COMMIT_TAG APK (x86_64)\",\"url\":\"$CI_PROJECT_URL/-/jobs/$APK_JOB_ID/artifacts/raw/artifacts/android/gecko-$VERSION_URL-x86_64.apk\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Gecko $CI_COMMIT_TAG Linux Desktop (x64)\",\"url\":\"$CI_PROJECT_URL/-/jobs/$LINUX_JOB_ID/artifacts/raw/artifacts/linux/gecko-$VERSION_URL-linux.tar.gz\",\"link_type\":\"package\"}"

