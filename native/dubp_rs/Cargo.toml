[package]
name = "dubp_rs"
version = "0.1.0"
authors = ["Éloïs SANCHEZ <elois@duniter.org>"]
edition = "2018"

[lib]
name = "dubp_rs"
crate-type = ["rlib"]

[dependencies]
allo-isolate = "0.1.6"
dup-crypto = { version = "0.36.0", features = ["dewif", "mnemonic", "mnemonic_french", "rand", "scrypt"] }
ffi_helpers = "0.2"
thiserror = "1.0.23"

[build-dependencies]
cbindgen = "0.14.3"
dart-bindgen = "0.1.7"